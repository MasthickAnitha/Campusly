<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Campusly|Need it ? Find it?</title>
        <style>
            *{
                box-sizing:border-box; 
                margin:0;
                padding:0;
            }
            body{
                font-family: Arial, Helvetica, sans-serif;
                background: #d9e4ec;
                color:#242e35;
            }
            header{
                background:#173c4d;
                color:white;
                padding: 22px 8%;
            }
            nav{
                display:flex;
                justify-content: space-between;
                align-items:center;
                flex-wrap:wrap;
                gap: 12px;
            }
            .logo{
                font-size: 25px;
                font-weight: bold;
            }
            nav a{
                color:white;
                text-decoration: none;
                margin-left: 18px;
            }
            .hero{
                text-align: center;
                padding:30px 20px;
                background:#e0e9ee;

            }
            .hero h1{
                font-size: 30px;
                margin-bottom:25px;
            }
            .tagline{
                margin-top:0;
            }
            .hero p{
                color:#506658;
                margin-bottom:25px;
                line-height:2.6;
            }
            .search{
                width:90%;
                max-width:480px;
                padding:14px;
                border:1px solid #cbd0d8;
                border-radius:8px;
                font-size:16px;
            }
            .items{
                padding: 40px 8%;
            }
            .filters{
                display:flex;
                flex-wrap:wrap;
                gap:10px;
                margin-bottom:25px;
            }
            .filters button{
                padding:9px 16px;
                border:1px solid #b8c7cb;
                border-radius:20px;
                background:white;
                cursor:pointer;
            }
            .filters button.active{
                background:#174d38;
                color:white;
            }
            .item-list{
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
                gap: 22px;
            }
            .card{
                background:white;
                border-radius:12px;
                overflow:hidden;
                box-shadow:0 3px 12px #0000000c;
            }
            .item-icon{
                background:#e5eeef;
                padding:28px;
                text-align:center;
                font-size:52px;
            }
            .card-content{
                padding:20px
            }
            .card h3{
                margin-bottom:9px;
            }
            .card p{
                margin-bottom:10px;
                color:#66756b;
                font-size:14px;
            }
            .price{
                color:#17354d;
                font-weight: bold;
            }
            .borrow{
                width:100%;
                padding:11px;
                background:#173c4d;
                color:white;
                border:none;
                border-radius:7px;
                cursor:pointer;
                margin-top: 8px;
            }
            .borrow:hover{
                background:#24694d;
            }
            .empty{
                grid-column:1/ -1;
                padding:25px;
                text-align: center;
                color:#667075;
            }
            footer{
                text-align:center;
                background:#17334d;
                color:white;
                padding:22px;
                margin-top:25px;
            }
            @media (max-width:600px){
                hero h1{
                    font-size:29px;
                }
                header,.items{
                    padding-left:5%;
                    padding-right:5%;
                }
                nav a{
                    margin-left: 0;
                    margin-right:12px;
                }
            }
            .post-form select{
                padding:10px;
                margin:5px;
                border:1px solid #cbcdd8;
                border-radius:5px;


            }
        </style>
    </head>
    <body>
        <header>
            <nav>
                <div class="logo">🌍 Campusly</div>
                <div>
                    <a href="#home">Home</a>
                    <a href="#items">Explore items</a>
                </div>
            </nav>
        </header>
        <section class="hero" id="home">
            <h1>Need it? Find it?</h1>
            <p>
                Our campus sharing community.<br>
                Borrow what you need.Share what you have.
            </p>
            <input type="text"
            class="search"
            id="searchBox"
            placeholder="Search books,calculators,drafters....">
        </section>
        <section class="items" id="items">
            <h2>Explore Campuse items 🔍</h2>
        <section class="items" id="post">
            <h2>Share your item </h2>
            <div class="card-content">
            <input type="text" id="itemName" placeholder="Item name">
            <input type="text" id="ownerName" placeholder="Your name">
            <select id="itemCategory">
                <option value="Books">Books</option>
                <option value="Electronics">Electronics</option>
                <option value="Essentials">Essentials</option>
            </select>
            <button onclick="addItem()">Post Item</button>
        </div>
        </section>
            <div class="filters">
                <button class="active" data-category="All">All</button>
                <button data-category="Books">Books</button>
                <button data-category="Electronics">Electronics</button>
                <button data-category="Essentials">Essentials</button>
            </div>
            <div class="item-list" id="itemList"></div>
        </section>
        <footer>
            <p>Campusly  2026|Built for students by students 🩶</p>
        </footer>
        <script>
            const items=[
                {
                    name:"Engineering physics",
                    category:"Books",
                    icon:"📘",
                    owner:"Student A",
                    price:"Free to borrow"
                },
                {
                    name:"Drawing Essentials",
                    category:"Essentials",
                    icon:"📐",
                    owner:"Student B",
                    price:"Free to borrow",
                },
                {
                    name:"Scientific Calculator",
                    category:"Electronics",
                    icon:"📟",
                    owner:"Student C",
                    price:"Free to borrow"
                }
            ];
            const itemList = document.getElementById("itemList");
            const searchBox = document.getElementById("searchBox");
            const filterButtons = document.querySelectorAll(".filters button");
            let selectedCategory="All";
            function showItems(){
                const searchText=searchBox.value.toLowerCase();
                const filteredItems=items.filter(function(item){
                    const matchesSearch=item.name.toLowerCase().includes(searchText);
                    const matchesCategory=selectedCategory==="All" || item.category === selectedCategory; 
                    return matchesSearch && matchesCategory;
                });
                itemList.innerHTML= "";
                if(filteredItems.length === 0){
                    itemList.innerHTML=
                    `<p class="empty">No items found Try another search!</p>`;
                    return;
                }
                filteredItems.forEach(function(item){const card=document.createElement("div");
                card.className ="card";
                card.innerHTML =`
                <div class="item-icon">${item.icon}</div>
                <div class="card-content">
                    <h3>${item.name}</h3>
                    <p>Category:${item.category}</p>
                    <p>Owner:${item.owner}</p>
                    <p class="price">${item.price}</p>
                    <button class="borrow">Request to Borrow</button>
                    </div>
                `;
                     card.querySelector(".borrow").addEventListener("click",
                     function(){
                        alert(
                            "You selected"  + item.name+
                            "!The borrowing request feature is our next step."
                        );
                    }
                 );
                    itemList.appendChild(card);
                });

            }
            searchBox.addEventListener("input",showItems);
            filterButtons.forEach(function(button){
                button.addEventListener("click",function(){
                    selectedCategory=button.dataset.category;
                    filterButtons.forEach(function(btn){
                        btn.classList.remove("active");
                    });
                    button.classList.add("active");
                    showItems();
                });
            });
            function addItem(){
                const name= document.getElementById("itemName").value.trim();
                const owner=document.getElementById("ownerName").value.trim();
                const category=document.getElementById("itemCategory").value.trim();
                if(name ===""||owner===""){
                    alert("please enter the item name and your name!");
                    return;
                }
                const newItem={
                name:name,
                category:category,
                icon:"📦",
                owner:owner,
                price:"Free to borrow",
                available:true

            };
            items.push(newItem);
            };
            showItems();
        </script>
    </body>
</html>
